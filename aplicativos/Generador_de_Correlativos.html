<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de Correlativos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#5d6b7a;--bd:#c5cdd6;--ac:#0b6bcb;--acx:#fff;--hd:#e8eef5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mut:#95a3b2;--bd:#3a4655;--ac:#4aa3ff;--acx:#0a1118;--hd:#26313d}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mut:#95a3b2;--bd:#3a4655;--ac:#4aa3ff;--acx:#0a1118;--hd:#26313d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:20px;margin:0 0 12px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;display:grid;gap:14px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{border:2px solid var(--bd);border-radius:8px;padding:10px;cursor:pointer;background:transparent;color:var(--tx);text-align:left;font:inherit}
.opt b{display:block}.opt small{color:var(--mut)}
.opt.on{border-color:var(--ac);background:var(--hd)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
input[type=number]{width:140px;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:16px}
.chip{padding:9px 14px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--tx);cursor:pointer;font:inherit}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn{padding:10px 18px;border:0;border-radius:6px;background:var(--ac);color:var(--acx);font-weight:600;font-size:15px;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.err{color:#d33;font-size:13px;min-height:1em}
#out{margin-top:16px}
.title{font-weight:600;margin-bottom:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff;color:#000}
th,td{border:1px solid #000;padding:4px 8px;text-align:center;vertical-align:middle}
th{background:#e3e8ee;font-size:13px}
td{height:62px}
td.bc{width:34%;padding:4px 10px}
td.bc svg{width:100%;height:46px;display:block}
td.cod{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:17px;width:24%}
td.usr{width:20%}td.map{width:22%}
/* Look & feel alineado con Separación por temperatura */
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d22;--mut:#6c6c78;--bd:#e2e2e8;--ac:#ed2750;--acx:#fff;--hd:#fff0f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f5f5f7;--card:#fff;--tx:#1d1d22;--mut:#6c6c78;--bd:#e2e2e8;--ac:#ed2750;--acx:#fff;--hd:#fff0f3}}
body{padding:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--tx)}
.app{min-height:100vh;display:grid;grid-template-columns:200px minmax(0,1fr)}
aside{background:#ed2750;color:#fff;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
aside img{display:block;width:100%;max-width:155px;height:auto;object-fit:contain;border-radius:8px;padding:7px;margin:4px 0 12px}
.side-title{font-weight:800;font-size:15px}.side-sub{font-size:12px;opacity:.9}.side-divider{width:70%;height:1px;background:rgba(255,255,255,.45);margin:10px 0}.side-note{font-size:13px;line-height:1.5;font-weight:700}
.content{min-width:0;padding:24px clamp(14px,3vw,34px)}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:24px;line-height:1.25;margin:0 0 18px;font-weight:800;letter-spacing:-.02em}
.panel{background:#fff;border:1px solid #e2e2e8;border-radius:14px;padding:20px;display:grid;gap:18px;box-shadow:0 3px 12px rgba(16,24,40,.035)}
label{font-size:12px;color:#6c6c78;font-weight:650}
.opt{border:1.5px solid #e2e2e8;border-radius:10px;padding:13px;background:#fff;color:#1d1d22;transition:border-color .15s,background .15s}
.opt:hover{border-color:#ed2750}.opt.on{border-color:#ed2750;background:#fff0f3}.opt b{font-size:14px;margin-bottom:4px}.opt small{font-size:12px;color:#6c6c78}
input[type=number]{border:1px solid #d6d6de;border-radius:8px;padding:10px;background:#fff;color:#1d1d22;outline:none}input[type=number]:focus{border-color:#ed2750;box-shadow:0 0 0 3px rgba(237,39,80,.12)}
.chip{border:1px solid #e2e2e8;border-radius:8px;background:#fff;color:#34343b;padding:9px 13px;font-weight:650}.chip.on{background:#ed2750;color:#fff;border-color:#ed2750}
.btn{border:1.5px solid #ed2750;border-radius:8px;padding:11px 17px;background:#ed2750;color:#fff;font-weight:750;transition:filter .15s}.btn:hover{filter:brightness(.95)}.btn.sec{background:#fff;color:#ed2750;border:1.5px solid #ed2750}.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:#b42318;font-weight:600}
#out{margin-top:20px}.title{font-size:15px;font-weight:800;margin:0 0 10px;color:#292932}
.scroll{overflow-x:auto;border:1px solid #e2e2e8;border-radius:10px;background:#fff}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{display:none}.content{padding:18px 12px}.panel{padding:15px}h1{font-size:21px}.row{gap:9px}input[type=number]{width:125px}}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff;padding:0}.app{display:block}.content{padding:0}.panel,h1,.noprint,aside{display:none!important}
 #out{margin:0}.scroll{overflow:visible;border:0;border-radius:0}thead{display:table-header-group}tr{page-break-inside:avoid;break-inside:avoid}
 td{height:17mm}td.bc svg{height:12mm}th,td{border:1px solid #000!important}
}
</style>
</head>
<body>
<div class="app">
 <aside class="noprint"><img src="https://www.icbfs.cl/wp-content/uploads/2022/02/logo-icbfs.png" alt="ICB Food Service"><div class="side-title">ICB Food Service</div><div class="side-sub">Productividad operacional</div><div class="side-divider"></div><div class="side-note">Generador de<br>Correlativos</div></aside>
 <div class="content"><div class="wrap">
 <h1>Generador de correlativos con código de barras</h1>
 <div class="panel">
  <div><label>1. Tipo de sección a imprimir</label><div class="opts" id="secs"></div></div>
  <div><label>2. Rango de códigos</label><div class="row"><div id="chips" class="row"></div><div><label for="ini">Desde</label><input type="number" id="ini" min="0"></div><div><label for="fin">Hasta</label><input type="number" id="fin" min="0"></div></div></div>
  <div class="row"><button class="btn" id="gen">Generar listado</button><button class="btn sec" id="prn" disabled>Imprimir</button></div>
  <div class="err" id="err"></div>
 </div>
 <div id="out"></div>
 </div></div>
</div>
<script>
var S=[
 {k:'FRI',n:'Frío normal',p:'Q_FRI_',s:100,chips:[100,200]},
 {k:'CON',n:'Congelados normal',p:'Q_CON_',s:100,chips:[100,200]},
 {k:'B2CF',n:'B2C Frío',p:'Q_FRI_',s:600,chips:[]},
 {k:'B2CC',n:'B2C Congelados',p:'Q_CON_',s:600,chips:[]}
];
var cur=S[0];
var $=function(i){return document.getElementById(i)};
function pick(s){
 cur=s;
 document.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('on',b.dataset.k===s.k)});
 $('ini').value=s.s;$('fin').value=s.s+49;
 var c=$('chips');c.innerHTML='';
 s.chips.forEach(function(v){
  var b=document.createElement('button');b.className='chip'+(v===s.s?' on':'');b.textContent='Desde '+v;
  b.onclick=function(){$('ini').value=v;$('fin').value=v+49;c.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b)})};
  c.appendChild(b);
 });
}
S.forEach(function(s){
 var b=document.createElement('button');b.className='opt';b.dataset.k=s.k;
 b.innerHTML='<b>'+s.n+'</b><small>'+s.p+s.s+' …</small>';
 b.onclick=function(){pick(s)};$('secs').appendChild(b);
});
pick(S[0]);
$('gen').onclick=function(){
 var a=parseInt($('ini').value,10),z=parseInt($('fin').value,10);
 $('err').textContent='';
 if(isNaN(a)||isNaN(z)||z<a){$('err').textContent='Ingresa un rango válido (Hasta debe ser mayor o igual a Desde).';return}
 if(z-a>1999){$('err').textContent='Máximo 2000 códigos por listado.';return}
 var h='<div class="title">'+cur.n+' — '+cur.p+a+' a '+cur.p+z+' ('+(z-a+1)+' códigos)</div><div class="scroll"><table><thead><tr><th>Código de barras</th><th>Correlativo</th><th>N° de Usuario</th><th>Mapeo</th></tr></thead><tbody>';
 for(var i=a;i<=z;i++){h+='<tr><td class="bc"><svg data-c="'+cur.p+i+'"></svg></td><td class="cod">'+cur.p+i+'</td><td class="usr"></td><td class="map"></td></tr>'}
 $('out').innerHTML=h+'</tbody></table></div>';
 document.querySelectorAll('svg[data-c]').forEach(function(s){
  try{
   JsBarcode(s,s.dataset.c,{format:'CODE128',width:2,height:50,displayValue:false,margin:0});
   if(!s.getAttribute('viewBox')){s.setAttribute('viewBox','0 0 '+parseInt(s.getAttribute('width'))+' '+parseInt(s.getAttribute('height')))}
   s.setAttribute('preserveAspectRatio','none');s.removeAttribute('width');s.removeAttribute('height');
  }catch(e){}
 });
 $('prn').disabled=false;
};
$('prn').onclick=function(){window.print()};
</script>
</body></html>
