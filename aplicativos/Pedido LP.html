<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido LP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#fff;--sf:#f6f6f8;--tx:#1a1a1f;--mu:#6b6b76;--bd:#e2e2e8;--ac:#ee0060;--on:#fff;--ok:#0a7a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--sf:#1b1b20;--tx:#ececf0;--mu:#9d9da8;--bd:#2d2d35;--ac:#ff4d8d;--on:#16060c;--ok:#4cd694;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--sf:#1b1b20;--tx:#ececf0;--mu:#9d9da8;--bd:#2d2d35;--ac:#ff4d8d;--on:#16060c;--ok:#4cd694;color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 2px}h1 i{font-style:normal;color:var(--ac)}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=number],select{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{display:grid;gap:10px}.f label{font-size:12px;color:var(--mu);display:grid;gap:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.cb{position:relative}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:300px;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.dd [data-c]{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}
.dd [data-c]:hover{background:var(--sf)}
.dd b{font-weight:600;display:block;color:var(--tx)}.dd small{color:var(--mu)}
.em{color:var(--mu);text-align:center;padding:12px 0;margin:0;font-size:14px}
#info{font-size:13px;color:var(--mu);background:var(--bg);border:1px dashed var(--bd);border-radius:8px;padding:8px 10px}
.btn{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:600;margin-top:8px}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.m{min-height:20px;font-size:13px;margin:8px 0 0;color:var(--ok)}.m.e{color:var(--ac)}
.q{display:flex;align-items:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);overflow:hidden}
.q button{border:0;background:none;width:32px;height:34px;font-size:18px;cursor:pointer}
.q button:hover{background:var(--sf)}
.q input{width:60px;text-align:center;border:0;border-left:1px solid var(--bd);border-right:1px solid var(--bd);padding:7px 2px;background:transparent;-moz-appearance:textfield}
.q input::-webkit-outer-spin-button,.q input::-webkit-inner-spin-button{-webkit-appearance:none}
.ln{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ln b{font-weight:600;font-size:14px}.ln small{color:var(--mu)}
.ln .t{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ln .x{display:flex;gap:10px;align-items:center}
.ln .rm{border:0;background:none;color:var(--mu);cursor:pointer;text-decoration:underline;font-size:12px}
.tt{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:10px;font-variant-numeric:tabular-nums}
.tt .big{font-size:18px;font-weight:700;border-top:1px solid var(--bd);padding-top:6px;margin-top:4px}
.ls{margin:0 0 8px;font-size:14px}.df{font-size:13px;color:var(--mu);margin:8px 0 0;white-space:pre-line}
</style>
</head>
<body>
<div class="w">
  <h1>Pedido <i>·</i> Lista de Precios</h1>
  <p class="sub">Sube tu lista de precios (.xlsx), elige categoría y descripción, indica la cantidad y confirma. El Excel saldrá solo con las líneas que agregues.</p>

  <div class="card">
    <h2>Lista de precios</h2>
    <p class="ls" id="ls"></p>
    <input type="file" id="fl" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <button class="btn p" id="up">Subir lista de precios (.xlsx)</button>
    <button class="btn" id="rs" hidden>Quitar la lista cargada</button>
    <p class="m" id="m3" role="status"></p>
    <div class="df" id="df" hidden></div>
  </div>

  <div class="card">
    <h2>Datos del cliente</h2>
    <div class="f">
      <label>Nombre<input type="text" data-k="nombre" autocomplete="name"></label>
      <div class="two">
        <label>Rut<input type="text" data-k="rut"></label>
        <label>Forma de pago<input type="text" data-k="pago"></label>
      </div>
      <label>Teléfono contacto<input type="text" data-k="tel" inputmode="tel" autocomplete="tel"></label>
      <label>Dirección despacho o bodega de retiro<input type="text" data-k="dir" autocomplete="street-address"></label>
    </div>
  </div>

  <div class="card">
    <h2>Agregar material</h2>
    <div class="f">
      <label>Categoría<select id="cat"><option value="">Todas las categorías</option></select></label>
      <label>Descripción
        <div class="cb">
          <input id="dq" type="text" placeholder="Escribe para buscar o toca para ver la lista…" autocomplete="off" role="combobox" aria-expanded="false">
          <div class="dd" id="dd" role="listbox" hidden></div>
        </div>
      </label>
      <div id="info" hidden></div>
      <label><span id="ul">Cantidad</span><input id="qty" type="number" inputmode="decimal" min="0" step="1" placeholder="0"></label>
    </div>
    <button class="btn p" id="add">Confirmar y agregar al pedido</button>
    <p class="m" id="m2" role="status"></p>
  </div>

  <div class="card">
    <h2>Tu pedido <span id="nl"></span></h2>
    <div id="lines"></div>
    <div class="tt">
      <span>Total neto</span><span id="tn">$0</span>
      <span>IVA 19%</span><span id="ti">$0</span>
      <span class="big">Total con IVA</span><span class="big" id="tg">$0</span>
    </div>
    <button class="btn p" id="xl">Descargar planilla Excel (LP)</button>
    <button class="btn" id="cp">Copiar pedido como texto</button>
    <button class="btn" id="cl">Vaciar pedido</button>
    <a class="btn p" id="dlk" hidden style="text-align:center;text-decoration:none;word-break:break-all"></a>
    <p class="m" id="msg" role="status"></p>
  </div>
</div>
<script>
/* P = [código, UM, descripción UM, categoría, descripción, precio neto, fila en la planilla] */
let P=[],TPL="",lname="Sin lista",custom=false;
try{const s=JSON.parse(localStorage.getItem("lp_lista")||"null");if(s&&s.tpl&&Array.isArray(s.P)&&s.P.length&&s.P[0].length>=7){P=s.P;TPL=s.tpl;lname=s.name||"Lista cargada";custom=true;}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clp=n=>"$"+Math.round(n).toLocaleString("es-CL");
let idx=new Map(P.map((p,i)=>[p[0],i]));
const st=p=>p[1]==="KG"?0.5:1;
let cart={},cli={nombre:"",rut:"",pago:"",tel:"",dir:""},sel=null;
try{const s=JSON.parse(localStorage.getItem("lp_pedido")||"null");if(s){cart=s.cart||{};Object.assign(cli,s.cli||{});}}catch(e){}
for(const c of Object.keys(cart))if(!idx.has(c))delete cart[c];
const save=()=>{try{localStorage.setItem("lp_pedido",JSON.stringify({cart,cli}))}catch(e){}};
const msg=(t,e,id)=>{const m=$(id||"#msg");m.textContent=t;m.classList.toggle("e",!!e);};
const ctl=p=>`<div class="q"><button data-a="-" aria-label="Quitar">−</button><input type="number" inputmode="decimal" min="0" step="${st(p)}" value="${cart[p[0]]||""}" placeholder="0" aria-label="Cantidad"><button data-a="+" aria-label="Agregar">+</button></div>`;
function fillCats(){$("#cat").innerHTML='<option value="">Todas las categorías</option>';[...new Set(P.map(p=>p[3]))].sort().forEach(c=>$("#cat").insertAdjacentHTML("beforeend",`<option>${esc(c)}</option>`));}
fillCats();

function showDD(){
  if(!P.length){$("#dd").innerHTML='<p class="em">Primero sube tu lista de precios (.xlsx).</p>';$("#dd").hidden=false;return;}
  const q=$("#dq").value.toLowerCase().split(/\s+/).filter(Boolean),c=$("#cat").value;
  const f=P.filter(p=>(!c||p[3]===c)&&q.every(t=>p[4].toLowerCase().includes(t)||p[0].includes(t)));
  $("#dd").innerHTML=(f.slice(0,60).map(p=>`<div role="option" data-c="${p[0]}"><b>${esc(p[4])}</b><small>${c?"":esc(p[3])+" · "}${esc(p[2])} · ${clp(p[5])} neto</small></div>`).join("")+(f.length>60?`<p class="em">Hay ${f.length-60} más; sigue escribiendo para acotar.</p>`:""))||'<p class="em">Sin resultados.</p>';
  $("#dd").hidden=false;$("#dq").setAttribute("aria-expanded","true");}
function hideDD(){$("#dd").hidden=true;$("#dq").setAttribute("aria-expanded","false");}
function clearSel(){sel=null;$("#info").hidden=true;$("#ul").textContent="Cantidad";$("#qty").step="1";}
function pick(c){sel=P[idx.get(c)];$("#dq").value=sel[4];hideDD();
  $("#info").hidden=false;$("#info").textContent="Código "+sel[0]+" · "+sel[3]+" · "+sel[2]+" ("+sel[1]+") · "+clp(sel[5])+" neto · "+clp(sel[5]*1.19)+" con IVA";
  $("#ul").textContent="Cantidad ("+sel[2]+")";$("#qty").step=st(sel);msg("",0,"#m2");$("#qty").focus();}
$("#dq").addEventListener("input",()=>{clearSel();showDD();});
$("#dq").addEventListener("focus",showDD);
$("#dq").addEventListener("keydown",e=>{if(e.key==="Escape")hideDD();if(e.key==="Enter"){const o=$("#dd [data-c]");if(!$("#dd").hidden&&o){e.preventDefault();pick(o.dataset.c);}}});
$("#dd").addEventListener("click",e=>{const o=e.target.closest("[data-c]");if(o)pick(o.dataset.c);});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".cb"))hideDD();});
$("#cat").addEventListener("change",()=>{clearSel();$("#dq").value="";hideDD();});
function add(){
  if(!P.length){msg("Primero sube tu lista de precios (.xlsx).",1,"#m2");return;}
  if(!sel){msg("Primero elige una descripción de la lista.",1,"#m2");$("#dq").focus();return;}
  const q=parseFloat(String($("#qty").value).replace(",","."));
  if(!(q>0)){msg("Indica una cantidad mayor que 0.",1,"#m2");$("#qty").focus();return;}
  const prev=cart[sel[0]]||0;cart[sel[0]]=Math.round((prev+q)*100)/100;save();
  msg(prev?"Ya estaba en el pedido: ahora son "+cart[sel[0]]+" × "+sel[4]+".":"Agregado: "+q+" × "+sel[4]+".",0,"#m2");
  clearSel();$("#dq").value="";$("#qty").value="";renderOrd();$("#dq").focus();hideDD();}
$("#add").addEventListener("click",add);
$("#qty").addEventListener("keydown",e=>{if(e.key==="Enter")add();});

function renderOrd(){const ks=Object.keys(cart).sort((a,b)=>idx.get(a)-idx.get(b));let n=0;
  $("#lines").innerHTML=ks.map(c=>{const p=P[idx.get(c)],t=cart[c]*p[5];n+=t;
    return `<div class="ln" data-c="${c}"><div><b>${esc(p[4])}</b><br><small>${c} · ${esc(p[3])} · ${esc(p[2])} · ${clp(p[5])}</small></div><div class="t">${clp(t)}</div><div class="x">${ctl(p)}<button class="rm" data-a="x">Quitar</button></div></div>`;}).join("")||'<p class="em">Aún no agregas materiales.</p>';
  $("#tn").textContent=clp(n);$("#ti").textContent=clp(n*0.19);$("#tg").textContent=clp(n*1.19);
  $("#nl").textContent=ks.length?"("+ks.length+")":"";
  ["xl","cp","cl"].forEach(i=>$("#"+i).disabled=!ks.length);}
function setQ(c,q){q=Math.round(q*100)/100;if(!(q>0))delete cart[c];else cart[c]=q;save();renderOrd();}
$("#lines").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;const c=b.closest("[data-c]").dataset.c,p=P[idx.get(c)];
  if(b.dataset.a==="x")return setQ(c,0);setQ(c,(cart[c]||0)+(b.dataset.a==="+"?1:-1)*st(p));});
$("#lines").addEventListener("change",e=>{if(e.target.type!=="number")return;setQ(e.target.closest("[data-c]").dataset.c,parseFloat(String(e.target.value).replace(",","."))||0);});
document.querySelectorAll("[data-k]").forEach(i=>{i.value=cli[i.dataset.k]||"";i.addEventListener("input",()=>{cli[i.dataset.k]=i.value;save();});});
let armed=0;
$("#cl").addEventListener("click",()=>{const b=$("#cl");
  if(!armed){armed=1;b.textContent="Toca otra vez para vaciar el pedido";setTimeout(()=>{armed=0;b.textContent="Vaciar pedido";},4000);return;}
  armed=0;b.textContent="Vaciar pedido";cart={};save();renderOrd();msg("");});
$("#cp").addEventListener("click",async()=>{
  const ks=Object.keys(cart).sort((a,b)=>idx.get(a)-idx.get(b));
  let t="PEDIDO\nNombre: "+cli.nombre+"\nRut: "+cli.rut+"\nForma de pago: "+cli.pago+"\nTeléfono: "+cli.tel+"\nDirección: "+cli.dir+"\n\nCÓDIGO\tCANTIDAD\tUM\tDESCRIPCIÓN\n";
  ks.forEach(c=>{const p=P[idx.get(c)];t+=c+"\t"+cart[c]+"\t"+p[1]+"\t"+p[4]+"\n";});
  try{await navigator.clipboard.writeText(t);msg("Pedido copiado.");}
  catch(e){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();msg("Pedido copiado.");}catch(_){msg("No se pudo copiar.",1);}}});

/* ===== Excel: misma plantilla LP, solo con las líneas del pedido ===== */
function buildSheet(x){
  const rm={},re=/<row\s(?:[^>]*?\s)?r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g;let m;
  while((m=re.exec(x)))rm[m[1]]=m[0];
  const cr=ref=>new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  const sty=a=>{const k=/\ss="(\d+)"/.exec(a);return k?' s="'+k[1]+'"':"";};
  const put=(s,ref,inner,t)=>s.replace(cr(ref),(mm,a)=>'<c r="'+ref+'"'+sty(a)+(t||"")+'>'+inner+'</c>');
  let head=x.slice(0,x.indexOf('<row r="14"')),tail=x.slice(x.indexOf("</sheetData>"));
  [cli.nombre,cli.rut,cli.pago,cli.tel,cli.dir].forEach((v,i)=>{head=put(head,"C"+(i+1),'<is><t xml:space="preserve">'+esc(v.trim())+'</t></is>',' t="inlineStr"');});
  const ks=Object.keys(cart).sort((a,b)=>idx.get(a)-idx.get(b));
  let n=14,tot=0,mid="";
  for(const c of ks){const p=P[idx.get(c)],o=p[6],q=cart[c],t=q*p[5];tot+=t;
    let r=rm[o].replace('r="'+o+'"','r="'+n+'"').replace(/<c r="([A-Z]+)\d+"/g,'<c r="$1'+n+'"');
    r=cr("B"+n).test(r)?put(r,"B"+n,"<v>"+q+"</v>"):r.replace(cr("A"+n),mm=>mm+'<c r="B'+n+'"><v>'+q+'</v></c>');
    r=put(r,"H"+n,"<f>+G"+n+"*1.19</f><v>"+(p[5]*1.19)+"</v>");
    r=put(r,"I"+n,"<f>+G"+n+"*B"+n+"</f><v>"+t+"</v>");
    mid+=r;n++;}
  const last=n-1,tk=Object.keys(rm).find(k=>+k>13&&/SUBTOTAL\(/.test(rm[k]));
  const tr=rm[tk].replace('r="'+tk+'"','r="'+n+'"').replace(/<c r="([A-Z]+)\d+"/g,'<c r="$1'+n+'"').replace(/SUBTOTAL\(9,I\d+:I\d+\)/,"SUBTOTAL(9,I14:I"+last+")").replace(/(<f>[^<]*<\/f>)<v>[^<]*<\/v>/,"$1<v>"+tot+"</v>");
  head=head.replace(/<dimension ref="[^"]*"\/>/,'<dimension ref="A1:I'+n+'"/>').replace(/<selection[^>]*\/>/,'<selection activeCell="A1" sqref="A1"/>');
  tail=tail.replace(/(<conditionalFormatting sqref=")A14:A\d+/,"$1A14:A"+last).replace(/(<autoFilter ref="A13:I)(\d+)/,(mm,a,b)=>+b>13?a+last:mm);
  return head+mid+tr+tail;}
function fixPkg(w,ct,rels){
  return [w.replace(/<calcPr([^>]*?)\/>/,(m,a)=>'<calcPr'+a.replace(/\sfullCalcOnLoad="[^"]*"/,"")+' fullCalcOnLoad="1"/>'),
    ct.replace(/<Override[^>]*calcChain[^>]*\/>/,""),rels.replace(/<Relationship [^>]*calcChain[^>]*\/>/,"")];}
let dlUrl=null;
async function makeXlsx(){
  if(!window.JSZip)throw new Error("no se cargó la librería JSZip (revisa tu conexión)");
  if(!TPL)throw new Error("primero sube tu lista de precios (.xlsx)");
  const zip=await JSZip.loadAsync(TPL,{base64:true});
  zip.file("xl/worksheets/sheet1.xml",buildSheet(await zip.file("xl/worksheets/sheet1.xml").async("string")));
  const [w,ct,rl]=fixPkg(await zip.file("xl/workbook.xml").async("string"),await zip.file("[Content_Types].xml").async("string"),await zip.file("xl/_rels/workbook.xml.rels").async("string"));
  zip.file("xl/workbook.xml",w);zip.file("[Content_Types].xml",ct);zip.file("xl/_rels/workbook.xml.rels",rl);zip.remove("xl/calcChain.xml");
  return zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});}
$("#xl").addEventListener("click",async()=>{
  const nm="LP_"+(cli.nombre.trim().replace(/[^\p{L}\p{N}]+/gu,"_").replace(/^_|_$/g,"")||"pedido")+".xlsx",n=Object.keys(cart).length;
  let blob;
  try{blob=await makeXlsx();}catch(e){msg("No se pudo armar el Excel: "+(e&&e.message||e),1);return;}
  if(dlUrl)URL.revokeObjectURL(dlUrl);
  dlUrl=URL.createObjectURL(blob);
  const a=$("#dlk");a.href=dlUrl;a.download=nm;a.textContent="Descargar "+nm;a.hidden=false;
  let dl=null;
  try{dl=window.claude&&typeof claude.use==="function"?await claude.use("downloads"):null;}catch(e){dl=null;}
  if(dl){
    try{await dl.save({filename:nm,data:blob});msg("Planilla generada con las "+n+" líneas del pedido.");}
    catch(e){const c=e&&(e.code||e.message)||"error";
      msg(c==="declined"?"Descarga cancelada. Puedes volver a intentarlo o usar el botón de abajo.":"El visor no dejó guardar el archivo ("+c+"). Prueba con el botón “Descargar” de abajo.",1);}
    return;}
  try{a.click();}catch(e){}
  msg("Planilla lista con las "+n+" líneas. Si no empezó la descarga, toca el botón “Descargar” de abajo; si tampoco funciona, abre el aplicativo en una pestaña del navegador (fuera del chat) o usa “Copiar pedido”.");});

/* ===== Cargar lista de precios desde Excel (.xlsx) ===== */
const colLetters=s=>s.replace(/\d+/g,"");
const norm=s=>String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
function xmlDoc(s){
  const d=new DOMParser().parseFromString(s,"application/xml");
  if(d.getElementsByTagName("parsererror").length)throw new Error("el XML del Excel está dañado");
  return d;}
const txtOf=el=>[...el.getElementsByTagName("t")].filter(t=>t.parentNode.nodeName!=="rPh").map(t=>t.textContent).join("");
function updateLs(){
  $("#ls").textContent=custom?"Lista en uso: "+lname+" · "+P.length+" productos":"Aún no hay lista cargada. Sube tu Excel de lista de precios (.xlsx).";
  $("#rs").hidden=!custom;}
async function parseLista(zip){
  const sh=zip.file("xl/worksheets/sheet1.xml");
  if(!sh)throw new Error("no encuentro la hoja 1 del libro (xl/worksheets/sheet1.xml)");
  const xml=await sh.async("string");
  if(!xml.includes('<row r="14"'))throw new Error("la lista debe tener los productos desde la fila 14 y los encabezados en la fila 13, igual que la planilla LP");
  if(!/SUBTOTAL\(/.test(xml))throw new Error("no encuentro la fila de total (fórmula SUBTOTAL) bajo los productos, como en la planilla LP");
  const sst=[];
  const sf=zip.file("xl/sharedStrings.xml");
  if(sf)[...xmlDoc(await sf.async("string")).getElementsByTagName("si")].forEach(si=>sst.push(txtOf(si)));
  const rows=new Map();
  [...xmlDoc(xml).getElementsByTagName("row")].forEach(re=>{
    const r=+re.getAttribute("r"),o={};
    [...re.getElementsByTagName("c")].forEach(c=>{
      const col=colLetters(c.getAttribute("r")||""),t=c.getAttribute("t"),v=c.getElementsByTagName("v")[0];
      let val="";
      if(t==="inlineStr")val=txtOf(c);
      else if(v)val=t==="s"?(sst[+v.textContent]||""):v.textContent;
      o[col]=val;});
    rows.set(r,o);});
  /* columnas C..F: se detectan por el encabezado de la fila 13 */
  const h=rows.get(13)||{},cols=["C","D","E","F"],used=new Set(),m={};
  const take=(key,re)=>{for(const c of cols){if(used.has(c))continue;if(re.test(norm(h[c]))){m[key]=c;used.add(c);return;}}};
  take("cat",/categor|famil|grupo|linea|rubro/);
  take("ud",/(unidad|medida|\bum\b).*(descrip|nombre)|(descrip|nombre).*(unidad|medida|\bum\b)/);
  take("um",/^(um|u\.?m\.?|unidad|unidad de medida|medida)$/);
  take("desc",/descrip|producto|material|articulo|nombre/);
  const dflt={um:"C",ud:"D",cat:"E",desc:"F"},guessed=[];
  for(const k of Object.keys(dflt))if(!m[k]){m[k]=dflt[k];guessed.push(k);}
  const out=[],seen=new Set(),dup=[],bad=[];
  const clean=v=>String(v==null?"":v).trim().replace(/\.0+$/,"");
  [...rows.keys()].filter(r=>r>=14).sort((a,b)=>a-b).forEach(r=>{
    const o=rows.get(r),code=clean(o.A);
    if(!code)return;                                   /* fila vacía o de total */
    const desc=String(o[m.desc]||"").trim(),price=parseFloat(String(o.G).replace(",","."));
    if(!desc||!isFinite(price)){bad.push(r);return;}
    if(seen.has(code)){dup.push(code);return;}
    seen.add(code);
    const um=String(o[m.um]||"").trim()||"UN";
    out.push([code,um,String(o[m.ud]||"").trim()||um,String(o[m.cat]||"").trim()||"SIN CATEGORÍA",desc,price,r]);});
  if(!out.length)throw new Error("no encontré productos válidos desde la fila 14 (código en columna A, precio neto en columna G)");
  const hdrTxt=["A","B",...cols,"G"].map(c=>c+": "+(h[c]||"—")).join(" | ");
  const rep="Lista cargada: "+out.length+" productos.\nEncabezados fila 13 → "+hdrTxt
    +"\nEjemplo: "+out[0][0]+" · "+out[0][4]+" · "+clp(out[0][5])+" neto"
    +(guessed.length?"\nAviso: no reconocí el encabezado de "+guessed.join(", ")+" y usé la posición de la planilla LP; revisa el ejemplo.":"")
    +(bad.length?"\nOmitidas por falta de descripción o precio: filas "+bad.slice(0,15).join(", ")+(bad.length>15?"…":""):"")
    +(dup.length?"\nCódigos repetidos (se usó la primera aparición): "+[...new Set(dup)].slice(0,10).join(", ")+(dup.length>10?"…":""):"");
  return {list:out,xml,rep};}
function b64OfBuffer(buf){
  const u=new Uint8Array(buf);let s="";
  for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);}
function setDf(t){const d=$("#df");d.textContent=t||"";d.hidden=!t;}
$("#up").addEventListener("click",()=>$("#fl").click());
$("#fl").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  setDf("");msg("Leyendo "+f.name+"…",0,"#m3");
  try{
    if(!window.JSZip)throw new Error("no se cargó la librería JSZip (revisa tu conexión)");
    if(!/\.xlsx$/i.test(f.name))throw new Error("el archivo debe ser .xlsx (en Excel: Guardar como → Libro de Excel)");
    const buf=await f.arrayBuffer();
    let zip;
    try{zip=await JSZip.loadAsync(buf);}catch(_){throw new Error("no se pudo abrir el archivo; ¿está dañado o protegido con contraseña?");}
    const r=await parseLista(zip);
    /* prueba en seco: la planilla de salida debe poder armarse con este archivo */
    const sc=cart;cart={};
    try{buildSheet(r.xml);}catch(err){throw new Error("el archivo se leyó, pero no calza con el formato de la planilla LP ("+(err&&err.message||err)+")");}finally{cart=sc;}
    const tpl=b64OfBuffer(buf);
    P=r.list;TPL=tpl;lname=f.name.replace(/\.xlsx$/i,"");custom=true;
    idx=new Map(P.map((p,i)=>[p[0],i]));
    let quitados=0;
    for(const c of Object.keys(cart))if(!idx.has(c)){delete cart[c];quitados++;}
    let saved=true;
    try{localStorage.setItem("lp_lista",JSON.stringify({name:lname,tpl,P}));}catch(_){saved=false;}
    save();fillCats();clearSel();$("#dq").value="";hideDD();updateLs();renderOrd();
    setDf(r.rep+(quitados?"\nSe quitaron "+quitados+" líneas del pedido que ya no existen en la lista nueva.":""));
    msg("Lista “"+lname+"” cargada ("+P.length+" productos)."+(saved?"":" No se pudo guardar para la próxima vez; tendrás que volver a subirla."),0,"#m3");
  }catch(err){
    msg("No se cargó la lista: "+(err&&err.message||err),1,"#m3");
  }});
$("#rs").addEventListener("click",()=>{
  P=[];TPL="";lname="Sin lista";custom=false;idx=new Map();cart={};
  try{localStorage.removeItem("lp_lista");}catch(_){}
  save();fillCats();clearSel();$("#dq").value="";hideDD();updateLs();renderOrd();setDf("");
  msg("Lista quitada. Sube otra para seguir.",0,"#m3");});
updateLs();
renderOrd();
</script>
