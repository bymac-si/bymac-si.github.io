<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>Planner de Administración | Santa Josefina SpA</title>
<style>
:root{--navy:#10233f;--navy2:#1b3a63;--gold:#c9a24b;--bg:#f5f3ee;--card:#fff;--ink:#18212f;--mut:#667085;--line:#e4e0d6;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;color:var(--navy)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{height:84px;width:auto;display:block}
.brand small{color:#b9c4d6;font-size:12px;line-height:1.3;border-left:1px solid #ffffff44;padding-left:12px}
.btn{border:0;border-radius:999px;padding:9px 18px;font:600 14px inherit;cursor:pointer;background:var(--gold);color:var(--navy)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--navy)}
.btn.red{background:#fff;color:var(--red);border:1px solid #f1c0bb}
header .btn.sec{border-color:#ffffff55;color:#fff}
main{max-width:1180px;margin:auto;padding:22px 20px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:3px solid var(--gold)}
.stat b{font:700 28px Georgia,serif;color:var(--navy);display:block}
.stat span{color:var(--mut);font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input,.tools select,dialog input,dialog select,dialog textarea{border:1px solid #d5d0c3;border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink);width:100%}
.tools input,.tools select{width:auto;min-width:140px}
.tabs{display:inline-flex;background:#e9e5da;border-radius:999px;padding:3px;margin-right:auto}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:999px;font:600 14px inherit;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mh h2{margin-right:auto;text-transform:capitalize;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:4px}
.day{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;background:#fcfbf8;overflow:hidden}
.day:hover{border-color:var(--gold)}
.day.out{opacity:.45}.day.today{border:2px solid var(--gold);background:#fff9e8}
.day .n{font-size:12px;font-weight:700;color:var(--mut)}
.chip{display:block;color:#fff;border-radius:6px;padding:1px 6px;margin-top:2px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip.done{opacity:.55;text-decoration:line-through}.chip.canc{opacity:.35}
.item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:last-child{border:0}
.dot{width:6px;align-self:stretch;border-radius:4px;flex:none}
.item h3{font-size:16px}.item p{margin:2px 0;color:var(--mut);font-size:13px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:#eef1f6;color:var(--navy);margin-left:6px;white-space:nowrap}
.tag.v{background:#fde8e6;color:var(--red)}.tag.r{background:#e3f4ec;color:#1d6b4c}
.empty{text-align:center;color:var(--mut);padding:30px}
dialog{border:0;border-radius:18px;padding:0;width:min(680px,94vw);box-shadow:0 20px 60px #10233f55}
dialog::backdrop{background:#10233f99}
.dh{background:var(--navy);color:#fff;padding:14px 20px}.dh h2{color:#fff;font-size:20px}
.df{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.df label{font-size:12.5px;font-weight:700;color:var(--navy);display:block}.df .w{grid-column:1/-1}
.df textarea{min-height:70px;resize:vertical}
.da{padding:0 20px 18px;display:flex;gap:8px;flex-wrap:wrap}.da .sp{margin-right:auto}
#ficha{display:none}
@media(max-width:700px){.day{min-height:62px}.chip{font-size:10px;padding:0 3px}.df{grid-template-columns:1fr}}
@media print{body>*:not(#ficha){display:none!important}#ficha{display:block;padding:20px;font-family:Georgia,serif;color:#000}
#ficha h1{border-bottom:3px solid var(--gold);padding-bottom:6px}#ficha td{padding:5px 8px;vertical-align:top;border-bottom:1px solid #ddd}#ficha pre{white-space:pre-wrap;font:inherit}}
</style>
</head>

<script>
const TIPOS={visita:['Visita inspectiva','#2f7d6d'],comite:['Reunión de comité','#2d5f9a'],asamblea_o:['Asamblea ordinaria','#10233f'],asamblea_e:['Asamblea extraordinaria','#a4472f'],mant:['Mantención / proveedor','#b7791f'],gc:['Gastos comunes / cobranza','#6b4c9a'],otro:['Otro','#667085']};
const K='sj_planner_v1',$=id=>document.getElementById(id);
let items=[];try{items=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
let view='cal',cur=new Date(),editId=null;cur.setDate(1);
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch(e){alert('No se pudo guardar en este navegador.')}};
const fmt=f=>f?new Date(f+'T12:00').toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
Object.entries(TIPOS).forEach(([k,v])=>{$('f_tipo').add(new Option(v[0],k));$('ft').add(new Option(v[0],k))});
function filtered(){const q=$('q').value.toLowerCase(),c=$('fc').value,t=$('ft').value,e=$('fe').value;
 return items.filter(i=>(!c||i.com===c)&&(!t||i.tipo===t)&&(!e||i.estado===e)&&(!q||JSON.stringify(i).toLowerCase().includes(q)))
 .sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')))}
const overdue=i=>i.estado==='Programada'&&i.fecha<today();
function setView(v){view=v;$('t_cal').className=v=='cal'?'on':'';$('t_list').className=v=='list'?'on':'';render()}
function render(){
 const coms=[...new Set(items.map(i=>i.com).filter(Boolean))].sort(),sel=$('fc').value;
 $('fc').innerHTML='<option value="">Todas las comunidades</option>'+coms.map(c=>`<option ${c==sel?'selected':''}>${esc(c)}</option>`).join('');
 $('coms').innerHTML=coms.map(c=>`<option value="${esc(c)}">`).join('');
 const t=today(),w=ymd(new Date(Date.now()+7*864e5));
 const s=[['Próximos 7 días',items.filter(i=>i.estado==='Programada'&&i.fecha>=t&&i.fecha<=w).length],['Vencidas sin cerrar',items.filter(overdue).length],['Asambleas programadas',items.filter(i=>i.estado==='Programada'&&i.tipo.startsWith('asamblea')).length],['Realizadas',items.filter(i=>i.estado==='Realizada').length]];
 $('stats').innerHTML=s.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
 const list=filtered();$('view').innerHTML=view=='cal'?cal(list):agenda(list)}
function cal(list){
 const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
 let h=`<div class="mh"><h2>${cur.toLocaleDateString('es-CL',{month:'long',year:'numeric'})}</h2><button class="btn sec" onclick="mv(-1)">‹</button><button class="btn sec" onclick="mv(0)">Hoy</button><button class="btn sec" onclick="mv(1)">›</button></div><div class="grid">`;
 h+=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dow">${d}</div>`).join('');
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const f=ymd(d);
  h+=`<div class="day ${d.getMonth()!=m?'out':''} ${f==today()?'today':''}" onclick="openForm(null,'${f}')"><span class="n">${d.getDate()}</span>`+
  list.filter(x=>x.fecha==f).map(x=>`<span class="chip ${x.estado=='Realizada'?'done':x.estado=='Cancelada'?'canc':''}" style="background:${TIPOS[x.tipo][1]}" title="${esc(x.titulo)}" onclick="event.stopPropagation();openForm('${x.id}')">${esc(x.hora||'')} ${esc(x.titulo||TIPOS[x.tipo][0])}</span>`).join('')+'</div>'}
 h+='</div><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px">'+Object.values(TIPOS).map(v=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${v[1]}"></i> ${v[0]}</span>`).join('')+'</div>';return h}
function agenda(list){if(!list.length)return'<div class="empty">No hay actividades con estos filtros. Crea la primera con “+ Nueva actividad”.</div>';
 return list.map(i=>`<div class="item" onclick="openForm('${i.id}')"><span class="dot" style="background:${TIPOS[i.tipo][1]}"></span><div style="flex:1"><h3>${esc(i.titulo||TIPOS[i.tipo][0])}<span class="tag">${TIPOS[i.tipo][0]}</span>${overdue(i)?'<span class="tag v">Vencida</span>':''}${i.estado=='Realizada'?'<span class="tag r">Realizada</span>':i.estado=='Cancelada'?'<span class="tag">Cancelada</span>':''}</h3>
 <p>${fmt(i.fecha)} ${esc(i.hora||'')} · ${esc(i.com||'Sin comunidad')}${i.lugar?' · '+esc(i.lugar):''}${i.resp?' · '+esc(i.resp):''}</p>${i.pend?`<p>▸ ${esc(i.pend.split('\n')[0])}${i.pend.includes('\n')?' …':''}</p>`:''}</div></div>`).join('')}
function mv(n){if(!n){cur=new Date();cur.setDate(1)}else cur.setMonth(cur.getMonth()+n);render()}
const F=['tipo','titulo','com','lugar','fecha','hora','resp','asis','notas','acuerdos','pend','estado'];
function openForm(id,fecha){editId=id||null;const i=id?items.find(x=>x.id==id):{tipo:'visita',estado:'Programada',fecha:fecha||today()};
 F.forEach(k=>$('f_'+k).value=i[k]||'');$('dt').textContent=id?'Editar actividad':'Nueva actividad';
 $('bdel').style.display=$('bprint').style.display=id?'':'none';dlg.showModal()}
function save(){const o={};F.forEach(k=>o[k]=$('f_'+k).value.trim());
 if(!o.fecha){alert('Indica la fecha.');return}
 if(!o.titulo)o.titulo=TIPOS[o.tipo][0]+(o.com?' · '+o.com:'');
 if(editId)Object.assign(items.find(x=>x.id==editId),o);else items.push({id:Date.now().toString(36),...o});
 persist();dlg.close();render()}
function del(){if(confirm('¿Eliminar esta actividad?')){items=items.filter(x=>x.id!=editId);persist();dlg.close();render()}}
